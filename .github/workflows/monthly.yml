name: Generate Monthly Invoice

on:
  # Run at 09:00 UTC on the 1st of each month
  schedule:
    - cron: '0 9 1 * *'
  # Allow manual triggering with optional month override
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month (YYYY-MM). Leave blank for last month.'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y libreoffice

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --deploy

      - name: Generate invoice
        env:
          CLOCKIFY_API_KEY: ${{ secrets.CLOCKIFY_API_KEY }}
          CLOCKIFY_WORKSPACE_ID: ${{ secrets.CLOCKIFY_WORKSPACE_ID }}
          CLOCKIFY_USER_ID: ${{ secrets.CLOCKIFY_USER_ID }}
        run: |
          if [ -n "${{ github.event.inputs.month }}" ]; then
            pipenv run python generate.py --month "${{ github.event.inputs.month }}"
          else
            pipenv run python generate.py
          fi

      - name: Upload invoice artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-${{ github.run_id }}
          path: backend/output/*.pdf
          retention-days: 90